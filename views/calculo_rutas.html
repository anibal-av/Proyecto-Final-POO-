<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Rutas</title>
</head>
<body>

    <a href="../index.html">Volver al Menú Principal</a>

    <h1>Cálculo de Costo de Ruta (HU3)</h1>
    <p>Selecciona una unidad disponible e ingresa la distancia del recorrido.</p>

    <form id="form-calculo">
        <label>Unidad disponible:</label>
        <select id="select-unidad-ruta">
        </select>

        <br><br>

        <label>Distancia del viaje (km):</label>
        <input type="number" id="distancia-km">

        <br><br>

        <button type="submit">Calcular costo de ruta</button>
    </form>

    <br>
    <p id="resultado-costo"></p>

    <script type="module" src="../js/index.js"></script>

</body>
</html>
